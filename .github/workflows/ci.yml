name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: niches
          POSTGRES_USER: niches
          POSTGRES_PASSWORD: niches
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niches -d niches"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt coverage

      - name: Run smoke tests with coverage
        working-directory: backend
        run: |
          coverage run --source=. --omit="tests/*,_legacy_flat_modules/*" tests/test_smoke.py
          coverage report -m
          coverage json -o ../assets/coverage.json

      - name: Commit coverage badge data
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Update coverage badge data [skip ci]"
            git push
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web/worker images
        run: docker compose build
